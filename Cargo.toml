[workspace]
resolver = "3"
members = [
    "crates/types",
    "crates/manifest",
    "crates/schema",
    "crates/codegen",
    "crates/macros",
    "crates/chain-api",
    "crates/chains/evm",
    "crates/chains/stellar",
    "crates/chains/solana",
    "crates/sdk",
    "crates/cli",
]
# `web/` is a pnpm/Nuxt workspace and must never be pulled into the Cargo graph.
exclude = ["web", "templates", "examples"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/blockSuperquery/superquery-sdk"
homepage = "https://superquery.vercel.app"
authors = ["SuperQuery contributors"]

[workspace.dependencies]
# --- internal ---------------------------------------------------------------
superquery-types = { path = "crates/types", version = "0.1.0" }
superquery-manifest = { path = "crates/manifest", version = "0.1.0" }
superquery-schema = { path = "crates/schema", version = "0.1.0" }
superquery-codegen = { path = "crates/codegen", version = "0.1.0" }
superquery-macros = { path = "crates/macros", version = "0.1.0" }
superquery-chain-api = { path = "crates/chain-api", version = "0.1.0" }
superquery-evm = { path = "crates/chains/evm", version = "0.1.0" }
superquery-stellar = { path = "crates/chains/stellar", version = "0.1.0" }
superquery-solana = { path = "crates/chains/solana", version = "0.1.0" }
superquery-sdk = { path = "crates/sdk", version = "0.1.0" }

# --- serialization ----------------------------------------------------------
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
indexmap = { version = "2.14", features = ["serde"] }

# --- diagnostics ------------------------------------------------------------
miette = "7.6"
thiserror = "2.0"
anyhow = "1.0"

# --- parsing / general ------------------------------------------------------
graphql-parser = "0.4"
semver = { version = "1.0", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
camino = { version = "1.2", features = ["serde1"] }
heck = "0.5"
sha2 = "0.11"
hex = "0.4"
walkdir = "2.5"

# --- cli --------------------------------------------------------------------
clap = { version = "4.6", features = ["derive", "env"] }

# --- proc macros ------------------------------------------------------------
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }
prettyplease = "0.3"

# --- evm --------------------------------------------------------------------
alloy-json-abi = "1.7"
alloy-primitives = "1.7"
alloy-sol-types = "1.7"

# --- dev --------------------------------------------------------------------
insta = { version = "1.48", features = ["yaml", "json"] }
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Mapping crates compiled to wasm want size, not speed-at-any-cost.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
panic = "abort"
