[package]
name = "superquery-sdk"
description = "The guest-side mapping SDK: what a SuperQuery indexer's src/lib.rs writes against."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
superquery-types.workspace = true
superquery-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true

alloy-primitives = { workspace = true, optional = true }
alloy-sol-types = { workspace = true, optional = true }
superquery-evm = { workspace = true, optional = true }

[features]
default = ["evm"]
# EVM mapping types and the `sol!` re-export.
evm = ["dep:alloy-primitives", "dep:alloy-sol-types", "dep:superquery-evm"]
