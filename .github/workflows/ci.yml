name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Validate the example project
        run: cargo run --locked -p superquery-cli -- validate -m templates/evm/project.yaml

      - name: Preview example code generation
        run: cargo run --locked -p superquery-cli -- codegen --dry-run -m templates/evm/project.yaml

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Generate production site
        run: bun run generate

      - name: Check static output
        run: bun run check:output

      - name: Install browser
        run: bunx --no-install playwright install --with-deps chromium

      - name: Browser and accessibility checks
        run: bun run test:e2e

      - name: Performance budget
        run: bun run test:perf

      - name: Save browser and performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-check-reports
          path: |
            web/playwright-report/
            web/test-results/
            web/.lighthouseci/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save deployable static site
        uses: actions/upload-artifact@v4
        with:
          name: marketing-site
          path: web/.output/public/
          include-hidden-files: true
          retention-days: 7
